name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

# This workflow does not need repository contents or a GitHub token.
permissions: {}

# Let already-started deployments finish: they may be applying a migration.
concurrency:
  group: cozycrowns-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Update Hetzner backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HETZNER_HOST: 46.224.62.32
      HETZNER_SSH_USER: ${{ vars.HETZNER_SSH_USER || 'github-deploy' }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null "$RUNNER_TEMP/hetzner_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/hetzner_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run backend update
        run: |
          ssh \
            -i "$RUNNER_TEMP/hetzner_deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HETZNER_SSH_USER@$HETZNER_HOST" \
            'sudo --non-interactive /opt/cozycrowns/backend/scripts/updateCode.sh ${{ github.sha }}'

  notify-on-failure:
    name: Email deployment failure
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@e9d44227e5ff9b5be74ac40a69c554324ded2e5b # v13
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_SENDER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "CozyCrowns backend deployment failed"
          to: kammerloher.andreas@gmail.com
          from: ${{ secrets.GMAIL_SENDER }}
          body: |
            Deployment of ${{ github.sha }} to 46.224.62.32 failed.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
